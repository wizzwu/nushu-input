name: 女书输入法离线安装包

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 构建平台
        type: choice
        default: all
        options: [all, windows, macos, android]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build_windows.py
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests
      - run: python scripts/package_delivery.py --platform windows
      - uses: actions/upload-artifact@v4
        with:
          name: NushuInput-Windows
          path: dist/*
          if-no-files-found: error

  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install archive extractor
        run: command -v 7z || command -v 7zz || brew install sevenzip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build_macos.py
      - name: Check native installer scripts
        run: |
          /usr/bin/ruby -c platforms/macos/configure.rb
          /bin/bash -n platforms/macos/postinstall
          /bin/bash -n platforms/macos/启用女书.command
      - name: Install and test on disposable macOS runner
        run: /bin/bash scripts/test_macos_install.sh
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests
      - run: python scripts/package_delivery.py --platform macos
      - uses: actions/upload-artifact@v4
        with:
          name: NushuInput-macOS
          path: dist/*
          if-no-files-found: error

  android:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Prepare SDK and extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build_android.py --unsigned
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests
      - name: Check unsigned APK identity and ABI
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/NushuInput-unsigned.apk
      - run: python scripts/package_delivery.py --platform android --full-native-source
      - uses: actions/upload-artifact@v4
        with:
          name: NushuInput-Android-unsigned-for-local-signing
          path: dist/*
          if-no-files-found: error
