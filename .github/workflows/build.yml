name: 女书输入法离线安装包

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build_windows.py
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests
      - run: python scripts/package_delivery.py --platform windows
      - uses: actions/upload-artifact@v4
        with:
          name: NushuInput-Windows
          path: dist/*
          if-no-files-found: error

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install archive extractor
        run: command -v 7z || command -v 7zz || brew install sevenzip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build_macos.py
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests
      - run: python scripts/package_delivery.py --platform macos
      - uses: actions/upload-artifact@v4
        with:
          name: NushuInput-macOS
          path: dist/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-22.04
    env:
      NUSHU_KEYSTORE: ${{ github.workspace }}/.build/signing/nushu-trial.jks
      NUSHU_STORE_PASSWORD: ${{ secrets.NUSHU_STORE_PASSWORD }}
      NUSHU_KEY_PASSWORD: ${{ secrets.NUSHU_KEY_PASSWORD }}
      NUSHU_KEY_ALIAS: ${{ secrets.NUSHU_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Prepare SDK and extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore persistent trial signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NUSHU_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Configure NUSHU_KEYSTORE_BASE64; refusing to generate a new signing identity.'; exit 1; }
          mkdir -p .build/signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$NUSHU_KEYSTORE"
          chmod 600 "$NUSHU_KEYSTORE"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build_android.py
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests
      - name: Verify APK signature and ABI
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/NushuInput.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/NushuInput.apk
      - run: python scripts/package_delivery.py --platform android --full-native-source
      - uses: actions/upload-artifact@v4
        with:
          name: NushuInput-Android
          path: dist/*
          if-no-files-found: error
      - name: Remove runner signing material
        if: always()
        run: rm -f "$NUSHU_KEYSTORE" .build/android/keystore.properties
